<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Management | BGPSC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p>Border Guard Public School and College</p>
    <h1>Teacher Management</h1>
    <p>Sylhet, Bangladesh</p>
    <p><a href="/" class="dashboard-link">Back to Dashboard</a></p>
  </header>

  <main class="student-page teacher-page">
    <section>
      <h2>Teacher Registration</h2>

      <form id="teacher-form">
        <div class="form-grid">
          <label>
            Full Name
            <input type="text" id="name" required>
          </label>

          <label>
            Employee ID
            <input type="text" id="employee-id" placeholder="Example: T-002" required>
          </label>

          <label>
            Phone Number
            <input type="tel" id="phone">
          </label>

          <label>
            Email Address
            <input type="email" id="email">
          </label>

          <label>
            Subject
            <input type="text" id="subject" placeholder="Example: English" required>
          </label>

          <label>
            Assigned Class and Section
            <input type="text" id="assigned-class" placeholder="Example: Class 7 - Section B">
          </label>

          <label>
            Joining Date
            <input type="date" id="joining-date">
          </label>

          <label>
            Monthly Salary (BDT)
            <input type="number" id="monthly-salary" min="0" step="0.01">
          </label>
        </div>

        <button type="submit">Register Teacher</button>
        <p id="form-message" role="status"></p>
      </form>
    </section>

    <section>
      <h2>Registered Teachers</h2>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Employee ID</th>
              <th>Subject</th>
              <th>Assigned Class</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Salary</th>
            </tr>
          </thead>
          <tbody id="teachers-table-body">
            <tr>
              <td colspan="8">Loading teachers...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="teachers.js"></script>
</body>
</html>
