<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management | BGPSC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p>Border Guard Public School and College</p>
    <h1>Student Management</h1>
    <p>Sylhet, Bangladesh</p>
    <p><a href="/" class="dashboard-link">Back to Dashboard</a></p>
  </header>

  <main class="student-page">
    <section>
      <h2>Student Registration</h2>

      <form id="student-form">
        <div class="form-grid">
          <label>
            Student Name
            <input type="text" id="name" required>
          </label>

          <label>
            Date of Birth
            <input type="date" id="date-of-birth">
          </label>

          <label>
            Class
            <input type="text" id="class" placeholder="Example: 8" required>
          </label>

          <label>
            Section
            <input type="text" id="section" placeholder="Example: A" required>
          </label>

          <label>
            Roll Number
            <input type="text" id="roll" required>
          </label>

          <label>
            Guardian Name
            <input type="text" id="guardian-name">
          </label>

          <label>
            Guardian Phone
            <input type="tel" id="guardian-phone">
          </label>

          <label class="full-width">
            Address
            <textarea id="address" rows="3"></textarea>
          </label>
        </div>

        <button type="submit">Register Student</button>
        <p id="form-message" role="status"></p>
      </form>
    </section>

    <section>
      <h2>Registered Students</h2>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Class</th>
              <th>Section</th>
              <th>Roll</th>
              <th>Guardian</th>
              <th>Phone</th>
            </tr>
          </thead>
          <tbody id="students-table-body">
            <tr>
              <td colspan="7">Loading students...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="students.js"></script>
</body>
</html>
