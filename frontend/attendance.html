<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Management | BGPSC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p>Border Guard Public School and College</p>
    <h1>Attendance Management</h1>
    <p>Sylhet, Bangladesh</p>
    <p><a href="/" class="dashboard-link">Back to Dashboard</a></p>
  </header>

  <main class="student-page attendance-page">
    <section>
      <h2>Record Daily Attendance</h2>

      <form id="attendance-form">
        <div class="form-grid">
          <label>
            Date
            <input type="date" id="date" required>
          </label>

          <label>
            Student Name
            <input type="text" id="student-name" required>
          </label>

          <label>
            Class
            <input type="text" id="class" placeholder="Example: 8" required>
          </label>

          <label>
            Section
            <input type="text" id="section" placeholder="Example: A" required>
          </label>

          <label>
            Roll Number
            <input type="text" id="roll">
          </label>

          <label>
            Attendance Status
            <select id="status" required>
              <option value="present">Present</option>
              <option value="absent">Absent</option>
              <option value="late">Late</option>
            </select>
          </label>
        </div>

        <button type="submit">Save Attendance</button>
        <p id="form-message" role="status"></p>
      </form>
    </section>

    <section>
      <h2>Attendance Records</h2>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Date</th>
              <th>Student Name</th>
              <th>Class</th>
              <th>Section</th>
              <th>Roll</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="attendance-table-body">
            <tr>
              <td colspan="7">Loading attendance records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="attendance.js"></script>
</body>
</html>
